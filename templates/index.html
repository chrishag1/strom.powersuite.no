{% extends "layout.html" %}

{% block title %}
    Strømpris kalkulator
{% endblock %}


{% block main %}
    <div class="main-card">
        <h1 class="text-center mb-4">Strømpriskalkulator</h1>

        <!-- Årlig forbruk -->
        <div class="d-flex justify-content-center align-items-center mb-4">
            <label for="annual-usage" class="form-label small me-2 mb-0">Årlig forbruk (kWh):</label>
            <input type="number" class="form-control border border-danger-subtle border-2" id="annual-usage" placeholder="16000" style="width: 120px;">
        </div>

        <!-- Sammenligning av avtaler -->
        <div class="row">
            <!-- Venstre kolonne -->
            <div class="col-5">
                <div class="mb-3">
                    <label for="select-deal-1" class="form-label">Strømavtale 1:</label>
                    <select class="form-select select-power-deal" id="select-deal-1" data-side="1">
                        <option disabled selected>Velg strømavtale</option>
                        {% for avtale in stromavtaler %}
                            <option
                              value="{{ avtale["id"] }}"
                              data-navn="{{ avtale["navn"] }}"
                              data-leverandor="{{ avtale["selskap"] }}"
                              data-paslag="{{ avtale["paaslag"] }}"
                              data-maned="{{ avtale["maanedspris"] }}"
                              data-pris="{{ avtale["kwpris"] }}"
                              {% if standard_avtale and avtale["id"] == standard_avtale["id"] %} selected {% endif %}
                            >
                              {{ avtale["navn"] }} – {{ avtale["selskap"] }}
                            </option>
                          {% endfor %}
                    </select>
                </div>
                <!-- Navn på avtale -->
                <div class="mb-3 d-flex align-items-center">
                    <label for="deal-name-1" class="form-label me-2 mb-0" style="white-space: nowrap;">Navn på avtale:</label>
                    <input type="text" class="form-control" id="deal-name-1">
                </div>

                <!-- Leverandør -->
                <div class="mb-3 d-flex align-items-center">
                    <label for="provider-1" class="form-label me-2 mb-0" style="white-space: nowrap;">Leverandør:</label>
                    <input type="text" class="form-control" id="provider-1">
                </div>
                <div class="mb-3" id="markup-1-row">
                    <div class="d-flex align-items-center">
                        <label for="markup-1" class="form-label me-2 mb-0">Påslag per kWh:</label>
                        <input type="number" class="form-control me-2 border border-danger-subtle border-2" id="markup-1" style="width: 100px;">
                        <span>øre/kWh</span>
                    </div>
                </div>
                <div class="mb-3" id="monthly-1-row">
                    <div class="d-flex align-items-center">
                        <label for="monthly-1" class="form-label me-2 mb-0">Månedspris:</label>
                        <input type="number" class="form-control me-2 border border-danger-subtle border-2" id="monthly-1" style="width: 100px;">
                        <span>kr per måned</span>
                    </div>
                </div>
                <div class="mb-3" id="baseprice-1-row">
                    <div class="d-flex align-items-center">
                        <label for="baseprice-1" class="form-label me-2 mb-0">Strømpris:</label>
                        <input type="number" class="form-control me-2 border border-danger-subtle border-2" id="baseprice-1" style="width: 100px;" placeholder="0">
                        <span>øre per kWh</span>
                    </div>
                </div>
            </div>

            <!-- Stiplet linje -->
            <div class="col-2 d-flex justify-content-center">
                <div style="border-left: 2px dashed #ccc; height: 100%;"></div>
            </div>

            <!-- Høyre kolonne -->
            <div class="col-5">
                <div class="mb-3">
                    <label for="select-deal-2" class="form-label">Strømavtale 2:</label>
                    <select class="form-select select-power-deal" id="select-deal-2" data-side="2">
                        <option disabled selected>Velg strømavtale</option>
                        {% for avtale in stromavtaler %}
                            <option
                              value="{{ avtale["id"] }}"
                              data-navn="{{ avtale["navn"] }}"
                              data-leverandor="{{ avtale["selskap"] }}"
                              data-paslag="{{ avtale["paaslag"] }}"
                              data-maned="{{ avtale["maanedspris"] }}"
                              data-pris="{{ avtale["kwpris"] }}"
                            >
                              {{ avtale["navn"] }} – {{ avtale["selskap"] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <!-- Navn på avtale -->
                <div class="mb-3 d-flex align-items-center">
                    <label for="deal-name-2" class="form-label me-2 mb-0" style="white-space: nowrap;">Navn på avtale:</label>
                    <input type="text" class="form-control" id="deal-name-2">
                </div>

                <!-- Leverandør -->
                <div class="mb-3 d-flex align-items-center">
                    <label for="provider-2" class="form-label me-2 mb-0" style="white-space: nowrap;">Leverandør:</label>
                    <input type="text" class="form-control" id="provider-2">
                </div>
                <div class="mb-3" id="markup-2-row">
                    <div class="d-flex align-items-center">
                        <label for="markup-2" class="form-label me-2 mb-0">Påslag per kWh:</label>
                        <input type="number" class="form-control me-2 border border-danger-subtle border-2" id="markup-2" style="width: 100px;">
                        <span>øre/kWh</span>
                    </div>
                </div>
                <div class="mb-3" id="monthly-2-row">
                    <div class="d-flex align-items-center">
                        <label for="monthly-2" class="form-label me-2 mb-0">Månedspris:</label>
                        <input type="number" class="form-control me-2 border border-danger-subtle border-2" id="monthly-2" style="width: 100px;">
                        <span>kr per måned</span>
                    </div>
                </div>
                <div class="mb-3" id="baseprice-2-row">
                    <div class="d-flex align-items-center">
                        <label for="baseprice-2" class="form-label me-2 mb-0">Strømpris:</label>
                        <input type="number" class="form-control me-2 border border-danger-subtle border-2" id="baseprice-2" style="width: 100px;" placeholder="0">
                        <span>øre per kWh</span>
                    </div>
                </div>
            </div>
            <!-- Vannrett stiplet linje -->
            <hr style="border-top: 2px dashed #eee; margin-top: 30px;">

            <!-- Resultat og knapp -->
            <div id="result-row" class="text-center mt-4">
                <button id="calculate-btn" class="btn" style="background-color: #f0f0f0; border: 1px solid white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 10px 30px;">
                    Regn ut
                </button>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function()
        {

            $('.select-power-deal').select2({
                placeholder: "Velg en strømavtale",
                width: '100%'
            });

            // Fokuser søkefeltet automatisk når dropdown åpnes
            $(document).on('select2:open', () => {
                document.querySelector('.select2-container--open .select2-search__field').focus();
            });


            // Autoutfyll når en avtale velges
            $('.select-power-deal').on('select2:select', function (e) {

              const selected = e.params.data.element.dataset;
              const side = e.target.dataset.side;

              document.getElementById(`deal-name-${side}`).value = selected.navn;
              document.getElementById(`provider-${side}`).value = selected.leverandor;
              document.getElementById(`markup-${side}`).value = selected.paslag;
              document.getElementById(`monthly-${side}`).value = selected.maned;
              document.getElementById(`baseprice-${side}`).value = selected.pris;
            });

            // Fjern verdier hvis bruker fjerner valget
            $('.select-power-deal').on('select2:clear', function (e) {
              const side = e.target.dataset.side;

              document.getElementById(`deal-name-${side}`).value = ""
              document.getElementById(`provider-${side}`).value = ""
              document.getElementById(`markup-${side}`).value = ""
              document.getElementById(`monthly-${side}`).value = ""
              document.getElementById(`baseprice-${side}`).value = ""
            });

            document.getElementById(`deal-name-1`).value = "{{ standard_avtale["navn"] }}";
            document.getElementById(`provider-1`).value = "{{ standard_avtale["selskap"] }}";
            document.getElementById(`markup-1`).value = {{ standard_avtale["paaslag"] }};
            document.getElementById(`monthly-1`).value = {{ standard_avtale["maanedspris"] }};
            document.getElementById(`baseprice-1`).value = {{ standard_avtale["kwpris"] }};


        });

    </script>

    <script>
       document.getElementById("calculate-btn").addEventListener("click", function () {
           let usage = parseFloat(document.getElementById("annual-usage").value);
           if (isNaN(usage) || usage <= 0) {
               usage = 16_000
           }

           if (isNaN(parseFloat(document.getElementById("baseprice-1").value))) {
               document.getElementById("baseprice-1").value = 0
           }

           if (isNaN(parseFloat(document.getElementById("baseprice-2").value))) {
              document.getElementById("baseprice-2").value = 0
           }


           const leftFields = {
               ons: document.getElementById("markup-1"),
               fixed: document.getElementById("monthly-1"),
               power: document.getElementById("baseprice-1")
           };

            const rightFields = {
                ons: document.getElementById("markup-2"),
                fixed: document.getElementById("monthly-2"),
                power: document.getElementById("baseprice-2")
            };

        // Fjern gamle feilmeldinger og resultater
        document.querySelectorAll(".error-msg").forEach(e => e.remove());
        document.querySelectorAll(".price-result").forEach(e => e.remove());

        const sides = [leftFields, rightFields];
        const results = [];

        sides.forEach((fields, index) => {
            let valid = true;

            Object.entries(fields).forEach(([key, input]) => {
                if (!input.value || input.value.trim() === "") {
                    const msg = document.createElement("div");
                    msg.className = "error-msg text-danger small mt-1";
                    msg.innerText = "Vennligst skriv inn en verdi";

                    // Finn container-row og legg meldingen etter hele raden
                    const container = input.closest(".mb-3");
                    container.appendChild(msg);
                    valid = false;
                }
            });

            if (valid) {
                const onslag = parseFloat(fields.ons.value);
                const fixed = parseFloat(fields.fixed.value);
                const power = parseFloat(fields.power.value);
                const yearly = (onslag + power) / 100 * usage + fixed * 12;
                const monthly = yearly / 12;

                const output = document.createElement("div");
                output.className = "price-result text-success mt-2";
                output.innerHTML = `
                    <p>Strømpris per år: ${yearly.toFixed(2)} kr</p>
                    <p>Strømpris per måned: ${monthly.toFixed(2)} kr</p>
                `;
                // Plasser under siste felt i kolonnen
                fields.fixed.closest(".col-5").appendChild(output);

                results.push({ side: index, value: yearly });
            }
        });

        if (results.length === 2) {
            const cheaper = results[0].value < results[1].value ? 0 : 1;
            const difference_year = Math.abs(results[0].value - results[1].value);
            const difference_month = difference_year / 12

            const saveLine = document.createElement("div");
            saveLine.className = "price-result text-primary fw-bold mt-2";
            saveLine.innerText = `Sparer: ${difference_year.toFixed(2)} kr/år \n ${difference_month.toFixed(2)}kr/måned`;

            const side = cheaper === 0 ? leftFields : rightFields;
            side.fixed.closest(".col-5").appendChild(saveLine);
        }
       });

       document.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                e.preventDefault(); // Hindrer eventuell form-submit
                document.getElementById("calculate-btn").click(); // Trigger knappens funksjon
            }
        });
    </script>

{% endblock %}
