{% extends "kompnenter/layout.html" %}

{% block title %}
    Strømpris kalkulator
{% endblock %}


{% block main %}
    <div class="embed-card">
        <h1 class="text-center mb-4">Strømpriskalkulator</h1>

        <!-- Årlig forbruk -->
        <div class="d-flex justify-content-center align-items-center mb-4">
            <label for="annual-usage" class="form-label small me-2 mb-0">Årlig forbruk (kWh):</label>
            <input type="number" class="form-control border border-danger-subtle border-2" id="annual-usage" placeholder="16000" style="width: 120px;">
        </div>

        <!-- Sammenligning av avtaler -->
        <div class="row">
            <!-- Venstre kolonne -->
            <div class="col-12 col-md-5">
                <!-- Velge strømavtale -->
                <div class="mb-3">
                    <label for="select-deal-2" class="form-label">Din Strømavtale</label>
                    <select class="form-select select-power-deal" id="select-deal-2" data-side="2">
                        <option disabled selected>Velg strømavtale</option>
                        {% for avtale in stromavtaler %}
                            <option
                              value="{{ avtale["id"] }}"
                              data-navn="{{ avtale["navn"] }}"
                              data-leverandor="{{ avtale["selskap"] }}"
                              data-paslag="{{ avtale["paaslag"] }}"
                              data-maned="{{ avtale["maanedspris"] }}"
                              data-pris="{{ avtale["kwpris"] }}"
                            >
                              {{ avtale["navn"] }} – {{ avtale["selskap"] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Navn på avtale -->
                <div class="mb-3 d-flex align-items-center">
                    <label for="deal-name-2" class="form-label me-2 mb-0" style="white-space: nowrap;">Navn på avtale:</label>
                    <input type="text" class="form-control" id="deal-name-2">
                </div>

                <!-- Leverandør -->
                <div class="mb-3 d-flex align-items-center">
                    <label for="provider-2" class="form-label me-2 mb-0" style="white-space: nowrap;">Leverandør:</label>
                    <input type="text" class="form-control" id="provider-2">
                </div>

                <!-- Påslag -->
                <div class="mb-3" id="markup-2-row">
                    <div class="d-flex align-items-center">
                        <label for="markup-2" class="form-label me-2 mb-0">Påslag per kWh:</label>
                        <input type="number" class="form-control me-2 border border-danger-subtle border-2" id="markup-2" style="width: 100px;">
                        <span>øre/kWh</span>
                    </div>
                </div>

                <!-- Månedspris -->
                <div class="mb-3" id="monthly-2-row">
                    <div class="d-flex align-items-center">
                        <label for="monthly-2" class="form-label me-2 mb-0">Månedspris:</label>
                        <input type="number" class="form-control me-2 border border-danger-subtle border-2" id="monthly-2" style="width: 100px;">
                        <span>kr per måned</span>
                    </div>
                </div>

                <!-- Strømpris -->
                <div class="mb-3" id="baseprice-2-row">
                    <div class="d-flex align-items-center">
                        <label for="baseprice-2" class="form-label me-2 mb-0">Spotpris:</label>
                        <input type="number" class="form-control me-2 border border-danger-subtle" id="baseprice-2" style="width: 100px;" placeholder="0">
                        <span>øre per kWh</span>
                    </div>
                </div>
            </div>

            <div id="resultat" class="price-result text-success mt-2">

            </div>


            <!-- Resultat og knapp -->
            <div id="result-row" class="text-center mt-2">
                <button id="calculate-btn" class="btn" style="background-color: #f0f0f0; border: 1px solid white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 10px 30px;">
                    Regn ut
                </button>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function()
        {

            $('.select-power-deal').select2({
                placeholder: "Velg en strømavtale",
                width: '100%'
            });

            // Fokuser søkefeltet automatisk når dropdown åpnes
            $(document).on('select2:open', () => {
                document.querySelector('.select2-container--open .select2-search__field').focus();
            });


            // Autoutfyll når en avtale velges
            $('.select-power-deal').on('select2:select', function (e) {

              const selected = e.params.data.element.dataset;

              document.getElementById(`deal-name-2`).value = selected.navn;
              document.getElementById(`provider-2`).value = selected.leverandor;
              document.getElementById(`markup-2`).value = selected.paslag;
              document.getElementById(`monthly-2`).value = selected.maned;
              document.getElementById(`baseprice-2`).value = selected.pris;
            });

            // Fjern verdier hvis bruker fjerner valget
            $('.select-power-deal').on('select2:clear', function (e) {

              document.getElementById(`deal-name-2`).value = ""
              document.getElementById(`provider-2`).value = ""
              document.getElementById(`markup-2`).value = ""
              document.getElementById(`monthly-2`).value = ""
              document.getElementById(`baseprice-2`).value = ""
            });
        });

    </script>

    <script>
        function sendHeight() {
            const height = document.body.scrollHeight;
            const width = document.body.scrollWidth;

            window.parent.postMessage({
                type: 'resize-iframe',
                height: height,
                width: width
            }, '*'); // Du kan spesifisere eksakt domene her for ekstra sikkerhet
        }

       document.getElementById("calculate-btn").addEventListener("click", function () {
           let usage = parseFloat(document.getElementById("annual-usage").value);
           if (isNaN(usage) || usage <= 0) {
               usage = 16_000
           }

           if (isNaN(parseFloat(document.getElementById("baseprice-2").value))) {
              document.getElementById("baseprice-2").value = 0
           }


           const leftFields = {
               ons: {{ standard_avtale["paaslag"] }},
               fixed: {{ standard_avtale["maanedspris"] }},
               power: {{ standard_avtale["kwpris"] }}
           };


            const rightFields = {
                ons: document.getElementById("markup-2"),
                fixed: document.getElementById("monthly-2"),
                power: document.getElementById("baseprice-2")
            };

            // Fjern gamle feilmeldinger og resultater
            document.querySelectorAll(".error-msg").forEach(e => e.remove());
            document.querySelectorAll(".price-result").forEach(e => e.remove());

            const sides = [leftFields, rightFields];
            const results = [];

            let valid = true

            Object.entries(rightFields).forEach(([key, input]) => {
                if (!input.value || input.value.trim() === "") {
                    const msg = document.createElement("div");
                    msg.className = "error-msg text-danger small mt-1";
                    msg.innerText = "Vennligst skriv inn en verdi";

                    // Finn container-row og legg meldingen etter hele raden
                    const container = input.closest(".mb-3");
                    container.appendChild(msg);
                    valid = false;
                }
            });

            if (valid) {

                let onslag = parseFloat(leftFields.ons);
                let fixed = parseFloat(leftFields.fixed);
                let power = parseFloat(leftFields.power);
                let yearly = (onslag + power) / 100 * usage + fixed * 12;

                results.push({value: yearly});

                onslag = parseFloat(rightFields.ons.value);
                fixed = parseFloat(rightFields.fixed.value);
                power = parseFloat(rightFields.power.value);
                yearly = (onslag + power) / 100 * usage + fixed * 12;

                results.push({value: yearly});
            }

            console.log(results)

            if (results.length === 2) {
                const difference_year = results[1].value - results[0].value;

                const spare_tekst =  document.createElement("div")
                spare_tekst.className = "price-result text-success mt-2";
                if ( difference_year > 0) {
                    spare_tekst.innerHTML = `<p>Bytt til idag Eletra og spar ${difference_year.toFixed(0)} kr</p>`
                }
                else {
                    spare_tekst.innerHTML = `<p>Du har en Powerful strømavtale idag. Godt valg</p>`
                }

                rightFields.fixed.closest(".col-12").appendChild(spare_tekst);
            }

           sendHeight()
       });

       document.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                e.preventDefault(); // Hindrer eventuell form-submit
                document.getElementById("calculate-btn").click(); // Trigger knappens funksjon
            }
        });

       document.body.scrollHeight += 46;
       window.onload = sendHeight;
    </script>

{% endblock %}
