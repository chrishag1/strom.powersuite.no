<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<iframe src="http://127.0.0.1:5000/power" id="strompriskalkulator" scrolling="no" style="border-radius: 1rem"></iframe>


<script>

    window.addEventListener('message', function(event) {

        const data = event.data;

        if (data.type === 'resize-iframe') {
            const frame = document.getElementById("strompriskalkulator");
            frame.style.height = data.height + "px";
            frame.style.width = data.width + "px";
        }
    });

</script>

</body>
</html>
